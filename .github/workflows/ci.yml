name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MPLBACKEND: Agg
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies (torch from the CPU wheel index when listed)
        run: |
          python -m pip install --upgrade pip
          if grep -qiE '^torch' requirements.txt; then pip install torch --index-url https://download.pytorch.org/whl/cpu; fi
          pip install -r requirements.txt
          pip install --no-deps -e .

      # Quick suites only (~1 min). tests/test_fit.py (~5 min) and tests/test_agent.py (~30 min) are run by hand
      # when fitting or scoring logic changes; see docs/STATE.md.
      - name: Run quick test suites
        run: python -m pytest tests/test_models.py tests/test_synth_extract.py tests/test_platforms.py tests/test_lab_features.py tests/test_api.py -q
